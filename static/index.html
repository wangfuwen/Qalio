<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qalio · 客服质检</title><link rel="stylesheet" href="/static/style.css"></head><body><aside><div class="brand"><i>Q</i><span>Qalio</span></div><p class="workspace">工作空间</p><nav><a class="active">▦　质检总览</a><a>◷　会话记录</a><a>⌁　问题洞察</a><a>◉　质检规则</a></nav><div class="aside-bottom"><div class="avatar">FW</div><div><b>甫文的工作台</b><small>管理员</small></div></div></aside><main><header><div><p class="crumb">质检中心 / <b>风险总览</b></p><h1>早上好，甫文 <span>✦</span></h1><p class="hint">这是今日客服风险的优先处理清单。</p></div><div class="head-actions"><label class="upload">导入对话 <input id="file" type="file" accept=".csv"></label><button class="ghost">⌄　近 7 天</button></div></header><section id="cards" class="cards"></section><section class="insight"><div class="chart"><div class="section-head"><div><p class="mini">风险趋势</p><h2>本周风险会话</h2></div><span class="up">↗ 12.4%</span></div><div class="bars"><i style="height:38%"><em>一</em></i><i style="height:54%"><em>二</em></i><i style="height:29%"><em>三</em></i><i style="height:78%"><em>四</em></i><i style="height:60%"><em>五</em></i><i style="height:92%"><em>六</em></i><i style="height:68%"><em>日</em></i></div></div><div class="priority"><p class="mini">需要关注</p><h2>Top 整改主题</h2><div id="top" class="top"></div><button class="text-button">查看完整洞察　→</button></div></section><section class="panel"><div class="toolbar"><div><p class="mini">风险队列</p><h2>待处理会话 <span id="count"></span></h2></div><div class="filters"><select id="priority"><option value="">全部等级</option><option>P0</option><option>P1</option><option>P2</option></select><select id="label"><option value="">全部风险类型</option></select></div></div><div id="list" class="list"></div></section></main><template id="item"><article class="item"><div class="row-title"><div class="check"></div><div><strong class="id"></strong><small class="meta"></small></div></div><span class="badge"></span><p class="labels"></p><blockquote></blockquote><span class="confidence"></span><button class="review">查看并复核　→</button></article></template><div id="modal" class="modal"><div class="modal-card"><button id="close">×</button><p class="mini">会话复核</p><h2 id="modal-title"></h2><div id="modal-content"></div><div class="actions"><button data-action="accepted">确认风险</button><button data-action="edited" class="ghost">修改结论</button><button data-action="rejected" class="danger">驳回</button></div></div></div><script src="/static/app.js"></script></body></html>
